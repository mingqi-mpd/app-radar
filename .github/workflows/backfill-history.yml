name: Backfill 7-day history (one-time)

# Run once by hand. Rebuilds app-radar/history/ for the last 7 days from the
# git history of latest.json, commits it, and never touches rolling-state.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild history from git
        run: |
          python3 - <<'PY'
          import datetime as dt, json, subprocess
          from pathlib import Path
          shas = subprocess.run(['git', 'log', '--format=%H', '--', 'app-radar/latest.json'],
                                capture_output=True, text=True, check=True).stdout.split()
          reports = {}
          for sha in shas:  # newest first: keep the final version of each day
              raw = subprocess.run(['git', 'show', f'{sha}:app-radar/latest.json'],
                                   capture_output=True, text=True)
              if raw.returncode:
                  continue
              report = json.loads(raw.stdout)
              reports.setdefault(report['date'], report)
          if not reports:
              raise SystemExit('No history found')
          newest = max(dt.date.fromisoformat(d) for d in reports)
          folder = Path('app-radar/history'); folder.mkdir(exist_ok=True)
          for date, report in sorted(reports.items()):
              if dt.date.fromisoformat(date) < newest - dt.timedelta(days=6):
                  continue
              path = folder / f'{date}.json'
              if path.exists():
                  print('keep', path); continue
              path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
              print('wrote', path, 'leads:', len(report['leads']), 'complete:', report['complete'])
          PY
      - name: Commit history
        run: |
          git config user.name "app-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-radar/history
          git diff --cached --quiet && echo "Nothing to add." || { git commit -m "Backfill 7-day history"; git push; }
